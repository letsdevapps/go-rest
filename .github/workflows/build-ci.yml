name: CI Go Rest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Baixar dependências
        run: go mod download

      #- name: Verificar formatação
      #  run: test -z "$(gofmt -l .)"

      - name: Rodar testes
        run: go test ./... -v

      - name: Build da aplicação
        run: go build -v ./...

      - name: Build Docker Image
        run: docker build -t go-rest .
